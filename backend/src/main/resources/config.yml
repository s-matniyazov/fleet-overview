      password: "if2u25pcf7"
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
server:
  port: 8088
  max-http-request-header-size: 100MB
  tomcat:
    max-swallow-size: 100MB
    max-http-form-post-size: 100MB
    connection-timeout: 20s
    threads:
      max: 10
    accesslog:
      enabled: true
      directory: /root/fleet/logs
      pattern: "%h %l %u %t \"%r\" %s %b"

