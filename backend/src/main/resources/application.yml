spring:
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  web:
    resources:
      static-locations: "classpath:/static/"
  application:
    name: "Fleet Overview"
  profiles:
    active: "prod"

# swagger-ui custom path
springdoc:
  swagger-ui:
    path: "/swagger-ui"
  show-actuator: true
  override-with-generic-response: false
