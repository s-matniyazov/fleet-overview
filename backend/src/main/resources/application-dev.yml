spring:
  application:
    name: "DEV"
  datasource:
    url: jdbc:postgresql://localhost:5432/fleetoverviewdb
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    show_sql: true
    hibernate:
      ddl-auto: create
    properties:
      logging:
        level:
          org.hibernate.engine.transaction.jta.platform.internal: ERROR
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
server:
  port: 8099
