version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: fleet_postgres
    restart: always
    environment:
      POSTGRES_DB: fleetoverviewdb
      POSTGRES_USER: fleetUser
      POSTGRES_PASSWORD: fleetPassword
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: fleet_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: fleet@fleet.com
      PGADMIN_DEFAULT_PASSWORD: fleet
    ports:
      - "5050:80"
    depends_on:
      - postgres

  springboot-app:
    build: .
    container_name: fleet_app
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleetoverviewdb
      SPRING_DATASOURCE_USERNAME: fleetUser
      SPRING_DATASOURCE_PASSWORD: fleetPassword
    ports:
      - "8088:8088"

volumes:
  pg_data:
